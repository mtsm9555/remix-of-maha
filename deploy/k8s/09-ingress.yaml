apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maha-ingress
  namespace: maha
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  rules:
  - host: maha.yourdomain.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: maha-backend
            port:
              number: 3000
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: maha-backend
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: maha-frontend
            port:
              number: 80
  tls:
  - hosts:
    - maha.yourdomain.com
    secretName: maha-tls-secret