apiVersion: apps/v1
kind: Deployment
metadata:
  name: maha-redis
  namespace: maha
  labels:
    app: maha-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maha-redis
  template:
    metadata:
      labels:
        app: maha-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: maha
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi