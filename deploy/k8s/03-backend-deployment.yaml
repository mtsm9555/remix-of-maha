apiVersion: apps/v1
kind: Deployment
metadata:
  name: maha-backend
  namespace: maha
  labels:
    app: maha-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: maha-backend
  template:
    metadata:
      labels:
        app: maha-backend
    spec:
      containers:
      - name: backend
        image: maha/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: maha-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: maha-config
              key: PORT
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: maha-config
              key: REDIS_HOST
        envFrom:
        - secretRef:
            name: maha-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      restartPolicy: Always